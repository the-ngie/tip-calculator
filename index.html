<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="div-container">
        <form class="tip-form">
            <h1>Tip Calculator</h1>
                <label for="bill">Enter Your Bill Amount</label>
                    <input type="number" id="bill" placeholder="Enter bill amount" required>
                    
        <div class="tip-buttons" id="tip">
            <button type="button" onclick="calculateTip(10)">10%</button>
            <button type="button" onclick="calculateTip(15)">15%</button>
            <button type="button" onclick="calculateTip(20)">20%</button>
        </div>
        <p id="result"></p>
    </form>
    </div>
</body>
    <script src="script.js"></script>
</html>
